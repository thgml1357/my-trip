<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 여행">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>우리 여행</title>
<script>
try{ if(!/[?&]home\b/.test(location.search)){ var t=localStorage.getItem('trip-last'); if(t==='japan'||t==='taiwan') location.replace(t+'/'); } }catch(e){}
</script>
<style>
:root{--bg:#fff;--ink:#111114;--sub:#6e6e76;--line:#e9e9ec;--soft:#f4f4f6;--accent:#c8102e;--green:#16803f;--brand:#2a7de1;--on-brand:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0c0c0d;--ink:#f3f3f5;--sub:#9a9aa3;--line:#262629;--soft:#18181a;--accent:#ff6b7d;--green:#52d08a;--brand:#6ab0ff;--on-brand:#07203f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  letter-spacing:-.01em;word-break:keep-all;padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:44px 0 4px}
.lead{color:var(--sub);margin:0 0 24px;font-size:15px}
a.trip{display:block;text-decoration:none;color:inherit;border:1.5px solid var(--ink);border-radius:18px;padding:20px 20px 18px;margin:0 0 14px;-webkit-tap-highlight-color:transparent}
a.trip:active{background:var(--soft)}
a.trip .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
a.trip b{font-size:24px;font-weight:800;letter-spacing:-.03em}
a.trip .chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
a.trip .chip.live{color:var(--accent);border-color:var(--accent)}
a.trip .chip.plan{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
a.trip .city{display:block;font-size:15px;color:var(--sub);margin-top:2px}
a.trip .meta{display:block;font-size:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
a.trip .go{float:right;font-size:20px;line-height:1}
.offstat{font-size:12px;color:var(--sub);margin-top:24px}
</style>
</head>
<body>
<main class="wrap">
  <h1>우리 여행</h1>
  <p class="lead">가는 곳을 눌러 주세요. 한 번 열어 두면 인터넷 없이도 열립니다.</p>

  <a class="trip" href="japan/" id="jp">
    <span class="row"><b>일본</b><span class="chip plan" id="jpchip">계획 중</span></span>
    <span class="city">교토 · 벚꽃 여행</span>
    <span class="meta">2027년 3월 29일 – 4월 2일 <span class="go">›</span></span>
  </a>

  <a class="trip" href="taiwan/" id="tw">
    <span class="row"><b>대만</b><span class="chip" id="twchip">다녀옴</span></span>
    <span class="city">타이베이 · 3박 4일</span>
    <span class="meta">2026년 11월 7일 – 10일 <span class="go">›</span></span>
  </a>

  <p class="offstat" id="offstat"></p>
</main>
<script>
[].forEach.call(document.querySelectorAll('a.trip'),function(a){a.addEventListener('click',function(){try{localStorage.setItem('trip-last',a.id==='jp'?'japan':'taiwan')}catch(e){}})});
(function(){
  var n=new Date(), d=n.getFullYear()*10000+(n.getMonth()+1)*100+n.getDate(), c=document.getElementById('twchip');
  if(d<20261107) c.textContent='출발 전';
  else if(d<=20261110){c.textContent='여행 중';c.className='chip live';}
  else c.textContent='다녀옴';
})();
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  var os=document.getElementById('offstat');
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ if(os) os.textContent='오프라인 저장을 지원하지 않는 브라우저입니다.'; });
    navigator.serviceWorker.ready.then(function(){ if(os) os.textContent='✓ 오프라인 저장 완료 · 인터넷 없이도 열립니다'; });
  });
}
</script>
</body>
</html>
